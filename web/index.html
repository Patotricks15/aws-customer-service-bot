<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer Service Bot</title>
  <style>
    body { font-family: -apple-system, Arial, sans-serif; max-width: 640px; margin: 40px auto; color: #232F3E; }
    h1 { font-size: 20px; }
    #gateway-url { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
    #log { border: 1px solid #ddd; border-radius: 6px; padding: 12px; height: 320px; overflow-y: auto; margin-bottom: 12px; }
    .msg { margin-bottom: 10px; }
    .msg.user { color: #146EB4; }
    .msg.bot { color: #232F3E; }
    #prompt { width: 78%; padding: 8px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Customer Service Bot</h1>
  <p>Paste the <code>chat_gateway_function_url</code> Terraform output below, then chat with the bot.</p>
  <input id="gateway-url" type="text" placeholder="https://.../ (chat_gateway_function_url)" />
  <div id="log"></div>
  <input id="prompt" type="text" placeholder="e.g. What's the inventory for prod-100?" />
  <button id="send">Send</button>

  <script>
    const urlInput = document.getElementById("gateway-url");
    const promptInput = document.getElementById("prompt");
    const log = document.getElementById("log");
    const sendBtn = document.getElementById("send");

    urlInput.value = localStorage.getItem("gatewayUrl") || "";
    let sessionId = null;

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = (role === "user" ? "You: " : "Bot: ") + text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function sendPrompt() {
      const gatewayUrl = urlInput.value.trim();
      const prompt = promptInput.value.trim();
      if (!gatewayUrl || !prompt) return;

      localStorage.setItem("gatewayUrl", gatewayUrl);
      appendMessage("user", prompt);
      promptInput.value = "";

      try {
        const res = await fetch(gatewayUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: prompt, sessionId: sessionId }),
        });
        const data = await res.json();
        sessionId = data.sessionId || sessionId;
        appendMessage("bot", data.answer || data.error || "(no response)");
      } catch (err) {
        appendMessage("bot", "Error: " + err.message);
      }
    }

    sendBtn.addEventListener("click", sendPrompt);
    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendPrompt();
    });
  </script>
</body>
</html>
